name: CI Workflow
on:
  push:
    branches: [master, 911-dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python (undefined names, syntax errors)
        working-directory: libs/vulscan-core
        run: ruff check .

  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            libs/vulscan-core/requirements.txt
            libs/vulscan-core/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: libs/vulscan-core/parsers/javascript/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: libs/vulscan-core/parsers/go/go_parser/go.mod
          cache-dependency-path: libs/vulscan-core/parsers/go/go_parser/go.mod

      - name: Install Python dependencies
        working-directory: libs/vulscan-core
        run: pip install -r requirements.txt && pip install ".[dev]"

      - name: Cache JS parser node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: libs/vulscan-core/parsers/javascript/node_modules
          key: ${{ runner.os }}-jsparser-nodemodules-${{ hashFiles('libs/vulscan-core/parsers/javascript/package-lock.json') }}

      - name: Install JS parser dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: libs/vulscan-core/parsers/javascript
        run: npm ci

      - name: Build go_parser binary (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: libs/vulscan-core/parsers/go/go_parser
        run: go build -o go_parser .

      - name: Build go_parser binary (Windows)
        if: runner.os == 'Windows'
        working-directory: libs/vulscan-core/parsers/go/go_parser
        run: go build -o go_parser.exe .

      - name: Run Python and parser tests
        working-directory: libs/vulscan-core
        run: python -m pytest tests/ -v

      - name: Verify Docker lifecycle on isolated CI runner
        if: runner.os == 'Linux'
        working-directory: libs/vulscan-core
        env:
          VULSCAN_DOCKER_LIFECYCLE_TESTS: "1"
        run: python -m pytest tests/test_docker_lifecycle_integration.py -v

  go-tests:
    name: Go build + integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VULSCAN_PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/vulscan-cli/go.mod
          cache-dependency-path: apps/vulscan-cli/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            libs/vulscan-core/requirements.txt
            libs/vulscan-core/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: libs/vulscan-core/parsers/javascript/package-lock.json

      - name: Vet
        working-directory: apps/vulscan-cli
        run: go vet ./...

      - name: Install Python dependencies
        working-directory: libs/vulscan-core
        run: python -m pip install -r requirements.txt && python -m pip install ".[dev]"

      - name: Run Go unit tests
        working-directory: apps/vulscan-cli
        run: go test ./... -v

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: apps/vulscan-cli
        run: go build -o vulscan .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/vulscan-cli
        run: go build -o vulscan.exe .

      - name: Verify binary exists
        working-directory: apps/vulscan-cli
        shell: bash
        run: |
          if [ -f vulscan ] || [ -f vulscan.exe ]; then
            echo "Binary built successfully"
          else
            echo "ERROR: Binary not found" && exit 1
          fi

      - name: Cache JS parser node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: libs/vulscan-core/parsers/javascript/node_modules
          key: ${{ runner.os }}-jsparser-nodemodules-${{ hashFiles('libs/vulscan-core/parsers/javascript/package-lock.json') }}

      - name: Install JS parser dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: libs/vulscan-core/parsers/javascript
        run: npm ci

      - name: Verify minimal deployment package
        if: runner.os == 'Linux'
        run: |
          python -m pip install hatchling
          python -m unittest discover -s scripts/tests -v
          python scripts/smoke-deployment.py --installer

      - name: Run Go CLI integration tests
        working-directory: libs/vulscan-core
        run: python -m pytest tests/test_go_cli.py -v --tb=short

  deployment:
    name: Clean deployment (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
    steps:
      - uses: actions/checkout@v7
      - name: Install isolated VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Build source deployment archive
        run: python3 scripts/package-deployment.py --output "$RUNNER_TEMP/source.tar.gz"
      - name: Run deploy, interrupted retry, redeploy, restart and reboot in a clean guest
        run: |
          sudo python3 scripts/tests/deploy_vm.py --ubuntu '${{ matrix.ubuntu }}' \
            --archive "$RUNNER_TEMP/source.tar.gz" --image-dir "$RUNNER_TEMP/cloud-images" \
            --output-dir "$RUNNER_TEMP/deploy-results"
      - name: Keep actual deployment and boot logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-ubuntu-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/deploy-results/*.log

  report-css:
    name: Report CSS reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/vulscan-cli/internal/report/tailwind/package-lock.json

      - name: Regenerate report.css from the pinned recipe
        working-directory: apps/vulscan-cli/internal/report/tailwind
        # NB: -o regen.css, NOT ../vendor/report.css — writing to the
        # committed path would make the cmp compare the file against ITSELF
        # (vacuously green on divergence). The distinct output is load-bearing.
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/tailwindcss -c tailwind.config.js -i input.css -o regen.css --minify

      - name: Compare with the committed bytes
        run: cmp apps/vulscan-cli/internal/report/tailwind/regen.css apps/vulscan-cli/internal/report/vendor/report.css

      - name: Clean the regen artifact
        working-directory: apps/vulscan-cli/internal/report/tailwind
        run: rm -f regen.css

  browser-smoke:
    name: Browser CSP smoke + golden render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/vulscan-cli/internal/server/testdata/browser-smoke/package-lock.json

      - name: Install Playwright + Chromium
        working-directory: apps/vulscan-cli/internal/server/testdata/browser-smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/vulscan-cli/go.mod

      - name: Run the browser smoke (real-browser CSP enforcement + the golden render oracle)
        working-directory: apps/vulscan-cli
        env:
          VULSCAN_BROWSER_TESTS: "1"
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: go test ./internal/server/ -run TestBrowserSmoke -v -count=1
