<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf" content="{{.CSRF}}">
<title>扫描进度 · 911VulScan</title>
<style nonce="{{.Nonce}}">
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
  header { background: #0d1117; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  header a { color: #8b949e; text-decoration: none; font-size: 0.85rem; }
  header a:hover { color: #fff; }
  header .sep { color: #8b949e; }
  header .title { color: #fff; font-size: 0.9rem; font-weight: 600; font-family: monospace; word-break: break-all; }
  .main { max-width: 900px; margin: 0 auto; padding: 28px 24px; }

  /* Pipeline steps */
  .steps { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: flex-start; }
  .step-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .step {
    padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    border: 2px solid #d0d7de; background: #f8f8f8; color: #999;
    transition: all 0.2s;
  }
  .step.active { border-color: #1a1a1a; background: #fff; color: #1a1a1a; }
  .step.done   { border-color: #1a7f37; background: #1a7f37; color: #fff; }
  .step-count { font-size: 0.72rem; color: #888; font-variant-numeric: tabular-nums; min-height: 1em; }

  /* Log terminal */
  .log-panel {
    background: #0d1117; border-radius: 8px; overflow: hidden;
    margin-bottom: 20px; border: 1px solid #30363d;
  }
  .log-header { padding: 8px 14px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; }
  .log-header span { color: #8b949e; font-size: 0.78rem; font-family: monospace; }
  .log-body {
    height: 360px; overflow-y: auto; padding: 12px 14px;
    font-family: "SF Mono", "Fira Code", monospace; font-size: 0.8rem;
    line-height: 1.6; scroll-behavior: smooth;
  }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line .ts { color: #484f58; }
  .log-line.ok      .body { color: #3fb950; }
  .log-line.finding .body { color: #f0883e; font-weight: 700; }
  .log-line.step-tag .body { color: #79c0ff; }
  .log-line.progress .body { color: #e3b341; }
  .log-line .body { color: #e6edf3; }

  /* Status bar */
  .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e3b341; flex-shrink: 0; }
  .dot.running { animation: pulse 1.4s ease-in-out infinite; }
  .dot.done    { background: #3fb950; }
  .dot.error   { background: #f85149; }
  /* #320 (wave round, consumers axis): the amber timeout dot — index.html's
     deliberate "amber warn, not the red error" for the same state; the scan
     page previously rendered timeout with the red error dot, contradicting
     the index badge's design. */
  .dot.timeout  { background: #9a6700; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .status-text { font-size: 0.9rem; color: #444; }

  /* Error banner */
  .error-banner { display: none; background: #ffebe9; border: 1px solid #ff818266; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; color: #cf222e; font-size: 0.875rem; }

  /* Buttons */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 8px 18px; border-radius: 6px; font-size: 0.875rem; font-weight: 600;
    text-decoration: none; cursor: pointer; border: 1px solid #d0d7de;
    background: #f5f5f5; color: #999; pointer-events: none;
    transition: all 0.15s; display: inline-block;
  }
  .btn.ready {
    background: #1a1a1a; color: #fff; border-color: #1a1a1a; pointer-events: auto;
  }
  .btn.ready:hover { background: #333; border-color: #333; }

  /* Disclosure reports */
  .disclosures { margin-top: 20px; }
  .disclosures-label {
    font-size: 0.78rem; font-weight: 600; color: #666;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .disclosure-links { display: flex; flex-direction: column; gap: 8px; }
  .btn-disclosure {
    padding: 7px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600;
    text-decoration: none; border: 1px solid #cf222e; color: #cf222e;
    background: #fff5f5; transition: all 0.15s; display: block;
  }
  .btn-disclosure:hover { background: #cf222e; color: #fff; }
  /* Shared 911VulScan workbench design; no remote fonts or assets. */
  body { background:#f0f5f6; color:#152b3b; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { background:#132c3c; } header a { color:#c6e8e3; } .main { max-width:1200px; padding:28px 24px; }
  .page-heading { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:28px; } .page-heading h1 { font-size:26px; margin:8px 0; } .page-heading p { font-size:12px; color:#5b7081; line-height:1.7; overflow-wrap:anywhere; } .eyebrow { color:#087d78; font-size:12px; letter-spacing:.08em; font-weight:700; } .new-scan { border:1px solid #bdd6d1; color:#087d78; text-decoration:none; padding:9px 14px; border-radius:8px; white-space:nowrap; font-size:13px; background:white; }
  .steps { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); background:white; border:1px solid #dbe5e9; border-radius:12px; padding:20px 12px; gap:10px; } .step-item { min-width:0; } .step { width:100%; text-align:center; border-radius:8px; padding:10px 6px; border:1px solid #dbe5e9; font-size:13px; line-height:1.6; } .step.active { background:#e5f5ef; color:#087d78; border-color:#087d78; } .step.done { background:#087d78; border-color:#087d78; } .step.skipped { border-style:dashed; } .step.failed { background:#fff3d6; color:#865600; border-color:#e2bb66; } .step-count { font-size:10px; text-align:center; line-height:1.7; }
  .log-panel { border-radius:12px; } .log-header { padding:13px 16px; justify-content:space-between; gap:16px; } .log-body { height:440px; font-size:12px; } .log-line .ts { color:#8295a2; } .log-empty { color:#93a9b9; } .autoscroll { color:#b4c8d2; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; } .autoscroll input { accent-color:#34d0b3; }
  .status-bar { background:#fff; border:1px solid #dbe5e9; border-radius:9px; padding:12px 16px; } .btn.ready { background:#087d78; border-color:#087d78; } .btn.ready:hover { background:#056661; } .artifact-note { font-size:12px; color:#5b7081; margin-top:12px; } footer { color:#5b7081; font-size:11px; padding-top:28px; } :focus-visible { outline:3px solid #e8a848; outline-offset:3px; }
  @media(max-width:700px) { header { padding:16px; } .main { padding:22px 16px; } .steps { grid-template-columns:repeat(3,minmax(0,1fr)); } .page-heading { align-items:flex-start; } .page-heading h1 { font-size:22px; } .log-body { height:50vh; min-height:260px; } .actions .btn { flex:1; text-align:center; padding:10px; } }
  @media(prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<header>
  <a href="/">← 返回工作台</a>
  <span class="sep">/</span>
  <span class="title">{{.Repo}}</span>
</header>
<main class="main"><div class="page-heading"><div><span class="eyebrow">911VulScan · 扫描任务</span><h1>跟踪分析进度</h1><p>模型配置：{{if .LLMConfig}}{{.LLMConfig}}{{else}}沿用已有配置{{end}} · 原始诊断信息保留命令与技术标识</p></div><a class="new-scan" href="/">新建扫描</a></div>
  <!-- Pipeline step tracker -->
  <div class="steps">
    <div class="step-item">
      <div class="step" id="step-parse">代码解析</div>
      <div class="step-count" id="count-parse"></div>
    </div>
    <div class="step-item">
      <div class="step" id="step-enhance">上下文增强</div>
      <div class="step-count" id="count-enhance"></div>
    </div>
    <div class="step-item">
      <div class="step" id="step-analyze">漏洞分析</div>
      <div class="step-count" id="count-analyze"></div>
    </div>
    <div class="step-item">
      <div class="step" id="step-verify">模拟验证</div>
      <div class="step-count" id="count-verify"></div>
    </div>
    <div class="step-item"><div class="step" id="step-dynamic">动态测试</div><div class="step-count" id="count-dynamic"></div></div>
    <div class="step-item">
      <div class="step" id="step-report">生成报告</div>
      <div class="step-count" id="count-report"></div>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner" role="alert">扫描未完成。请检查下方日志中的错误详情。</div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="dot running" id="status-dot"></div>
    <span class="status-text" id="status-text" data-state="connecting" role="status" aria-live="polite">正在连接扫描任务…</span>
  </div>

  <!-- Log terminal -->
  <div class="log-panel">
    <div class="log-header">
      <span>任务日志 / {{.ID}}</span><label class="autoscroll"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
    </div>
    <div class="log-body" id="log-body" tabindex="0" aria-label="扫描日志"><div id="log-empty" class="log-empty">等待扫描日志；任务可能正在排队…</div></div>
  </div>

  <!-- Report/Summary buttons -->
  <div class="actions">
    <a class="btn" id="btn-summary" href="/summary/{{.ID}}" target="_blank" rel="noopener" aria-disabled="true" tabindex="-1">查看中文摘要</a>
    <a class="btn" id="btn-report"  href="/report/{{.ID}}"  target="_blank" rel="noopener" aria-disabled="true" tabindex="-1">查看漏洞报告</a>
  </div>

  <p class="artifact-note" id="artifact-note" role="status"></p>
  <!-- Disclosure report links (populated on scan complete) -->
  <div class="disclosures" id="disclosures" style="display:none">
    <div class="disclosures-label">漏洞披露材料</div>
    <div class="disclosure-links" id="disclosure-links"></div>
  </div>
<footer>911VulScan · 基于 Knostic OpenAnt 构建</footer>
</main>

<script nonce="{{.Nonce}}">
const jobID = '{{.ID}}';

const steps = ['parse','enhance','analyze','verify','dynamic','report'];
const stepEls = {};
const countEls = {};
steps.forEach(s => {
  stepEls[s] = document.getElementById('step-' + s);
  countEls[s] = document.getElementById('count-' + s);
});

let streamClosed = false;
const stageCounts = {};

function setCount(stage, n) {
  stageCounts[stage] = n;
  if (countEls[stage]) countEls[stage].textContent = n.toLocaleString();
}

function markActive(name) {
  const el = stepEls[name];
  if (el && !el.classList.contains('done') && !el.classList.contains('failed')) {
    el.classList.add('active');
    el.setAttribute('aria-current', 'step');
  }
}
function markDone(name) {
  const el = stepEls[name];
  if (el) {
    el.classList.remove('active');
    el.removeAttribute('aria-current');
    el.classList.add('done');
    el.textContent = '✓ ' + el.textContent.replace(/^✓ /, '');
  }
}
function markAllDone() {
  steps.forEach(s => {
    if (stepEls[s].classList.contains('failed')) return;
    if (stepEls[s].classList.contains('active') || s === 'report') markDone(s);
    else if (!stepEls[s].classList.contains('done') && !stepEls[s].classList.contains('skipped')) { stepEls[s].classList.add('skipped'); countEls[s].textContent = '未执行或无阶段记录'; }
  });
}

function parseNum(s) {
  return parseInt(s.replace(/,/g, ''), 10);
}

function tryExtractCounts(line) {
  let m;
  // Parse: total units extracted
  m = line.match(/[Pp]arsed[:\s]+([\d,]+)\s+(?:code\s+)?units?/);
  if (!m) m = line.match(/([\d,]+)\s+(?:code\s+)?units?\s+(?:parsed|extracted|found)/i);
  if (!m) m = line.match(/\b([\d,]+)\s+functions?\s+(?:parsed|extracted|found)/i);
  if (m) { setCount('parse', parseNum(m[1])); return; }

  // Enhance: units being enhanced / sent for enhancement
  m = line.match(/[Ee]nhanc(?:ing|ed|ement)[:\s]+([\d,]+)/);
  if (!m) m = line.match(/([\d,]+)\s+units?\s+(?:to\s+)?enhanc/i);
  if (m) { setCount('enhance', parseNum(m[1])); return; }

  // Analyze: units being analyzed
  m = line.match(/[Aa]nalyz(?:ing|ed)[:\s]+([\d,]+)/);
  if (!m) m = line.match(/([\d,]+)\s+(?:units?|functions?)\s+(?:to\s+)?analyz/i);
  if (m) { setCount('analyze', parseNum(m[1])); return; }

  // Analyze: potential findings (also show in analyze bucket)
  m = line.match(/(\d[\d,]*)\s+potential\s+(?:vuln|finding)/i);
  if (m) { setCount('analyze', parseNum(m[1])); return; }

  // Verify: units being verified
  m = line.match(/[Vv]erif(?:ying|ied)[:\s]+([\d,]+)/);
  if (!m) m = line.match(/([\d,]+)\s+(?:findings?|units?)\s+(?:to\s+)?verif/i);
  if (m) { setCount('verify', parseNum(m[1])); return; }

  // Report: confirmed findings — matches pipeline_output.json log lines and disclosure generation
  m = line.match(/pipeline_output\.json[:\s]+([\d,]+)\s+findings?/i);
  if (!m) m = line.match(/[Gg]enerating\s+([\d,]+)\s+disclosures?/);
  if (!m) m = line.match(/[Dd]isclosures?[:\s]+([\d,]+)\s+files?/);
  if (!m) m = line.match(/([Rr]eport(?:ing|ed)?)[:\s]+([\d,]+)\s+(?:confirmed\s+)?findings?/);
  if (!m) m = line.match(/([\d,]+)\s+(?:confirmed\s+)?findings?\s+(?:in\s+)?report/i);
  if (m) { setCount('report', parseNum(m[m.length - 1])); return; }
}

function stageFromText(text) {
  if (/parsing repository|代码解析|解析仓库/.test(text)) return 'parse';
  if (/enhanc|application context|上下文|增强/.test(text)) return 'enhance';
  if (/vulnerability detection|漏洞检测|漏洞分析/.test(text)) return 'analyze';
  if (/verif|验证|复核/.test(text)) return 'verify';
  if (/dynamic|动态测试/.test(text)) return 'dynamic';
  if (/generating reports|summary report|disclosure docs|生成报告/.test(text)) return 'report';
  return null;
}
function finishActiveStages(next) {
  steps.forEach(stage => { if (stage !== next && stepEls[stage].classList.contains('active')) markDone(stage); });
}
function markSkipped(stage, reason) {
  const el = stepEls[stage];
  if (!el || el.classList.contains('done')) return;
  el.classList.remove('active'); el.removeAttribute('aria-current'); el.classList.add('skipped');
  countEls[stage].textContent = reason || '已跳过';
}
function updateSteps(line) {
  const l = line.replace(/^\d{2}:\d{2}:\d{2}\s+/, '').trim().toLowerCase();
  // The actual Python scanner emits numbered phase announcements, not only tags.
  if (/^\[\d+\/\d+\]/.test(l)) {
    const stage = stageFromText(l);
    if (stage) { finishActiveStages(stage); markActive(stage); }
    return;
  }
  if (/^-\s*(skipping|跳过)/.test(l)) {
    const stage = stageFromText(l);
    if (stage) markSkipped(stage, /docker not found|未找到 docker/.test(l) ? '未找到 Docker' : '已跳过');
    return;
  }
  if (/^(warning:|警告[：:])/.test(l) && /failed|失败/.test(l)) {
    const stage = stageFromText(l);
    if (stage) {
      stepEls[stage].classList.remove('active'); stepEls[stage].removeAttribute('aria-current');
      stepEls[stage].classList.add('failed'); countEls[stage].textContent = '存在警告，查看日志';
    }
    return;
  }
  const tagged = l.match(/^\[(parse|enhance|analyze|detect|verify|report|dynamic[-_]?test|dynamic)\]/);
  if (tagged) {
    const name = tagged[1] === 'detect' ? 'analyze' : tagged[1].startsWith('dynamic') ? 'dynamic' : tagged[1];
    finishActiveStages(name); markActive(name); return;
  }
  const completed = l.match(/^✓ (parse|enhance|analy\w*|detect|verify|report|dynamic)/);
  if (completed) {
    const name = completed[1].startsWith('analy') || completed[1] === 'detect' ? 'analyze' : completed[1];
    markDone(name);
  }
}

function classifyLine(line) {
  const l = line.toLowerCase();
  if (/warning|failed|error|警告|失败|错误/.test(l)) return 'finding';
  if (/^\[\d+\/\d+\]/.test(l.trim())) return 'step-tag';
  if (line.startsWith('✓') || /complete\b/.test(l)) return 'ok';
  if (/potential|vulner|finding|! /.test(l) && !line.startsWith('✓')) return 'finding';
  if (/^\[parse\]|^\[enhance\]|^\[analyze\]|^\[detect\]|^\[verify\]|^\[report\]|^\[dynamic/.test(l)) return 'step-tag';
  if (/→|analyzing batch|running|scanning|processing/.test(l)) return 'progress';
  return '';
}

function enableArtifact(id) {
  const link = document.getElementById(id);
  link.classList.add('ready'); link.removeAttribute('aria-disabled'); link.removeAttribute('tabindex');
}
// Only localize known presentation prefixes. Preserve filenames, source snippets,
// commands and machine diagnostics verbatim so evidence remains auditable.
function presentLog(line) {
  const labels = {parse:'代码解析', enhance:'上下文增强', analyze:'漏洞分析', detect:'漏洞检测', verify:'模拟验证', report:'生成报告', clone:'克隆仓库', error:'错误', warning:'警告', timeout:'超时', dynamic:'动态测试', 'dynamic-test':'动态测试', 'dynamic_test':'动态测试'};
  return line.replace(/^\[([a-z_-]+)\]/i, (tag, name) => labels[name.toLowerCase()] ? '[' + labels[name.toLowerCase()] + ']' : tag)
    .replace(/^✓ (parse|enhance|analyze|verify|report)\b/i, (_, name) => '✓ ' + labels[name.toLowerCase()])
    .replace(/Parsing repository\.\.\./g, '正在解析仓库…')
    .replace(/Generating application context\.\.\./g, '正在生成项目上下文…')
    .replace(/Enhancing dataset\.\.\./g, '正在增强代码上下文…')
    .replace(/Running vulnerability detection \(Stage 1\)\.\.\./g, '正在进行漏洞分析（第一阶段）…')
    .replace(/Running verification \(Stage 2\)\.\.\./g, '正在进行模拟验证（第二阶段）…')
    .replace(/Building pipeline_output\.json\.\.\./g, '正在汇总 pipeline_output.json…')
    .replace(/Running dynamic tests \(Docker\)\.\.\./g, '正在运行动态测试（Docker）…')
    .replace(/Generating reports\.\.\./g, '正在生成报告…')
    .replace(/Skipping dynamic test \(Docker not found\)\./g, '跳过动态测试（未找到 Docker）。')
    .replace(/Skipping dynamic test \(no findings to test\)\./g, '跳过动态测试（没有待测试发现）。')
    .replace(/Skipping dynamic test \(not enabled\)\./g, '跳过动态测试（未启用）。')
    .replace(/Skipping verification \(no vulnerable findings\)\./g, '跳过模拟验证（未发现待验证漏洞）。')
    .replace(/Skipping verification \(--no-verify or not requested\)\./g, '跳过模拟验证（未启用）。')
    .replace(/\[Scan\] LLM config:/g, '[扫描] 模型配置：')
    .replace(/\bParsed: (\d+) units/g, '已解析：$1 个代码单元')
    .replace(/\bEnhanced: (\d+) units/g, '已增强：$1 个代码单元')
    .replace(/\bConfirmed: (\d+) vulnerabilities/g, '已确认：$1 个漏洞');
}

function appendLine(rawLine) {
  const logBody = document.getElementById('log-body');
  const empty = document.getElementById('log-empty'); if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'log-line';

  // Extract optional HH:MM:SS timestamp prefix
  const tsMatch = rawLine.match(/^(\d{2}:\d{2}:\d{2})\s+(.*)/s);
  let body = rawLine;
  if (tsMatch) {
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = tsMatch[1] + ' ';
    div.appendChild(ts);
    body = tsMatch[2];
  }

  const cls = classifyLine(rawLine);
  if (cls) div.classList.add(cls);

  const bodySpan = document.createElement('span');
  bodySpan.className = 'body';
  bodySpan.textContent = presentLog(body);
  div.appendChild(bodySpan);

  logBody.appendChild(div);
  if (document.getElementById('auto-scroll').checked) logBody.scrollTop = logBody.scrollHeight;

  updateSteps(rawLine);
  tryExtractCounts(rawLine);
}

function loadDisclosures() {
  fetch('/disclosures/' + jobID)
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      if (!list || list.length === 0) return;
      const container = document.getElementById('disclosures');
      const links = document.getElementById('disclosure-links');
      list.forEach(d => {
        const a = document.createElement('a');
        a.href = d.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'btn-disclosure';
        a.textContent = d.label;
        links.appendChild(a);
      });
      container.style.display = '';
    })
    .catch(() => { document.getElementById('artifact-note').textContent = '披露材料暂时无法加载，请刷新重试。'; });
}

function onDone(status) {
  streamClosed = true;
  const emptyLog = document.getElementById('log-empty');
  if (emptyLog) emptyLog.textContent = '本任务未保留日志记录。';
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.classList.remove('running');
  text.dataset.state = status;

  if (status === 'done') {
    dot.classList.add('done');
    text.textContent = document.querySelector('.step.failed') ? '扫描已完成，部分阶段存在警告，请结合日志复核' : '扫描已完成';
    markAllDone();
    enableArtifact('btn-report');
    // Only enable Summary button if the summary actually exists.
    fetch('/summary/' + jobID, { method: 'HEAD' }).then(r => {
      if (r.ok) enableArtifact('btn-summary');
      else document.getElementById('artifact-note').textContent = '本次扫描未生成摘要，可先查看漏洞报告。';
    }).catch(() => { document.getElementById('artifact-note').textContent = '摘要状态暂时无法确认，请刷新重试。'; });
    loadDisclosures();
  } else if (status === 'timeout') {
    // #320: the invoke deadline killed the run — a distinct state with the
    // operator escape hatch named, not a generic failure. The amber dot +
    // the timeout-specific banner text (wave round: the red error dot and
    // the generic "Scan failed" banner contradicted index.html's deliberate
    // amber-not-red timeout design).
    dot.classList.add('timeout');
    text.textContent = '扫描已超时，可调高 OPENANT_INVOKE_TIMEOUT 后重新运行';
    document.getElementById('error-banner').textContent =
      '任务超时。可设置 OPENANT_INVOKE_TIMEOUT=2h 后重新运行；已生成的中间结果保留在任务目录中。';
    document.getElementById('error-banner').style.display = 'block';
  } else {
    dot.classList.add('error');
    text.textContent = '扫描未完成，请检查日志';
    document.getElementById('error-banner').style.display = 'block';
  }
}

function connect() {
  if (streamClosed) return;
  const es = new EventSource('/scan/' + jobID + '/logs');
  es.onopen = function() { if (!streamClosed) { const text = document.getElementById('status-text'); text.textContent = '扫描进行中，日志已连接'; text.dataset.state = 'running'; } };
  window.addEventListener('pagehide', () => es.close(), { once:true });

  es.onmessage = function(e) {
    appendLine(e.data);
  };

  es.addEventListener('done', function(e) {
    es.close();
    onDone(e.data);
  });

  es.onerror = function() {
    // Transient drops keep this EventSource in CONNECTING and the browser
    // auto-reconnects with Last-Event-ID, so the server resumes instead of
    // re-sending the whole log — leave those alone. CLOSED means a fatal,
    // non-retryable response (e.g. the job was deleted -> 404); stop and surface
    // it rather than spinning a fresh connection every 2s (an infinite loop).
    if (es.readyState === EventSource.CONNECTING && !streamClosed) { const text = document.getElementById('status-text'); text.textContent = '连接暂时中断，正在自动重连…'; text.dataset.state = 'reconnecting'; }
    if (es.readyState === EventSource.CLOSED && !streamClosed) {
      streamClosed = true;
      const text = document.getElementById('status-text');
      if (text) { text.textContent = '实时连接已断开，请刷新页面重新连接。'; text.dataset.state = 'disconnected'; }
    }
  };
}

window.addEventListener('pageshow', event => { if (event.persisted) { streamClosed = false; location.reload(); } });
connect();
</script>
</body>
</html>
