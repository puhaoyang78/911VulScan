<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}}</title><script src="/assets/shell.js"></script><link rel="stylesheet" href="/assets/tabler-1.4.0.min.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/account.css"><script defer src="/assets/account.js"></script></head>
<body><a class="skip-link" href="#main">跳到主要内容</a><header class="app-header"><a class="brand" href="/">安全扫描工作台</a><div class="header-actions"><button class="btn theme-toggle" type="button" data-theme-toggle aria-label="深色主题" aria-pressed="false"><span data-theme-label>主题</span></button></div></header>
<main id="main" class="auth-main"><div class="auth-intro"><h1>{{.Title}}</h1><p>代码安全扫描 · 模型复核 · 动态测试</p></div><section class="card auth-card">
{{if .Error}}<p class="account-feedback" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/{{.Mode}}" data-account-form>
<input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="next" value="{{.Next}}">
<label for="username">账号</label><input id="username" name="username" value="{{.Username}}" required pattern="[\p{L}\p{N}_.\-]{2,32}" autocomplete="username" autofocus aria-describedby="username-hint"><p class="hint" id="username-hint">2–32 个字符，支持中文、字母、数字和 ._-，不区分大小写。</p>
<label for="password">密码</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" pattern="[\s\S]{8,}" autocomplete="{{if eq .Mode "login"}}current-password{{else}}new-password{{end}}" aria-describedby="password-hint"><p class="hint" id="password-hint">至少 8 个字符。{{if eq .Mode "login"}}登录状态保留 7 天。{{end}}</p>
{{if ne .Mode "login"}}<label for="password-confirm">确认密码</label><input id="password-confirm" type="password" required minlength="8" maxlength="128" pattern="[\s\S]{8,}" autocomplete="new-password" data-password-confirm="password">{{end}}
<button class="btn btn-primary account-submit" type="submit">{{if eq .Mode "login"}}登录{{else}}注册并登录{{end}}</button>
</form>
<div class="auth-switch">{{if eq .Mode "login"}}还没有账号？<a href="/register">创建账号</a>{{else}}已有账号？<a href="/login">登录</a>{{end}}</div>
</section><footer>中文安全扫描工作台</footer></main></body></html>
