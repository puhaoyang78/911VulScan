<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Name}} · 911VulScan</title>
<style nonce="{{.Nonce}}">
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; }
  header { background: #0d1117; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  header a { color: #8b949e; text-decoration: none; font-size: 0.85rem; }
  header a:hover { color: #fff; }
  header .sep { color: #8b949e; }
  header .title { color: #fff; font-size: 0.9rem; font-weight: 600; }
  .main { max-width: 820px; margin: 32px auto; padding: 0 24px 48px; }
  .content {
    background: #fff; border: 1px solid #e1e4e8; border-radius: 8px;
    padding: 32px 40px; line-height: 1.7;
  }
  .content h1 { font-size: 1.6rem; margin-bottom: 16px; }
  .content h2 { font-size: 1.2rem; margin: 24px 0 10px; border-bottom: 1px solid #e1e4e8; padding-bottom: 6px; }
  .content h3 { font-size: 1rem; margin: 18px 0 8px; }
  .content h4 { font-size: 0.95rem; margin: 14px 0 6px; color: #444; }
  .content p  { margin-bottom: 12px; color: #333; }
  .content ul, .content ol { margin: 8px 0 12px 20px; }
  .content li { margin-bottom: 4px; }
  .content code { font-family: "SF Mono", "Fira Code", monospace; background: #f3f3f3; padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }
  .content pre { background: #0d1117; color: #e6edf3; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 14px 0; }
  .content pre code { background: none; padding: 0; color: inherit; font-size: 0.83em; }
  .content blockquote { border-left: 3px solid #d0d7de; padding-left: 14px; color: #666; margin: 12px 0; }
  .content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
  .content th, .content td { padding: 8px 12px; border: 1px solid #e1e4e8; text-align: left; }
  .content th { background: #f8f8f8; font-weight: 600; }
  .content hr { border: none; border-top: 1px solid #e1e4e8; margin: 24px 0; }
  .content a { color: #0969da; }
  .content a:hover { text-decoration: underline; }
  /* Severity badge colors for common disclosure headers */
  .content h2:first-of-type { color: #cf222e; }
  body { background:#f0f5f6; color:#152b3b; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { background:#132c3c; flex-wrap:wrap; } header a { color:#c6e8e3; } .main { max-width:1000px; } .content { border:1px solid #dbe5e9; border-radius:12px; overflow-wrap:anywhere; } .content pre { white-space:pre; overflow-x:auto; } .content table { display:block; overflow-x:auto; } footer { color:#5b7081; font-size:11px; padding-top:22px; }
  @media(max-width:600px) { header { padding:16px; gap:10px; } .main { margin-top:20px; padding:0 16px 32px; } .content { padding:22px 18px; } .content h1 { font-size:1.3rem; } }
  :focus-visible { outline:3px solid #e8a848; outline-offset:3px; }

  .main { max-width:1100px; }
  .content { border-radius:17px; padding:44px clamp(20px,5vw,65px); box-shadow:var(--shadow); }
  .content h1 { font-size:clamp(24px,3vw,34px); color:var(--ink); letter-spacing:-.03em; }
  .content h2 { font-size:20px; padding-top:8px; padding-bottom:12px; border-color:#dce8e9; color:var(--ink); }
  .content h3 { color:#087c76; }
  .content pre { background:#142b39; color:#e8f2f4; padding:20px; border-radius:11px; }
  .content pre code { color:inherit; }
  .content table { border:1px solid var(--line); border-radius:9px; }
  .content th { background:#edf5f4; }
  .document-heading { display:flex; justify-content:space-between; gap:15px; align-items:end; margin:25px 0 18px; }
  .document-heading h1 { font-size:27px; letter-spacing:-.02em; }
  .document-heading p { color:var(--muted); font-size:13px; }
  @media(max-width:700px){.document-heading{align-items:flex-start;flex-direction:column;}}

  /* Shared visual language: indigo-free, calm graphite and teal workbench. */
  :root { --ink:#192c3b; --muted:#607585; --line:#dbe6e9; --accent:#087c76; --paper:#ffffff; --bg:#f2f6f7; --shadow:0 12px 42px rgba(22,48,61,.06); }
  body { background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  header { background:#142d3b; }
  .main { max-width:1280px; }
  .card,.overview,.status-bar,.stats .stat { box-shadow:var(--shadow); border-radius:16px; }
  .card { border:1px solid var(--line); }
  .btn-primary,.btn.ready { background:var(--accent); border-color:var(--accent); }
  button,a,input,select { transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease; }
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #e3a947; outline-offset:3px; }
  .dialog { width:min(460px,calc(100% - 32px)); max-width:none; max-height:calc(100% - 32px); overflow:auto; margin:auto; border:1px solid #d9e4e7; border-radius:18px; padding:0; background:#fff; color:var(--ink); box-shadow:0 30px 85px rgba(12,35,48,.25); }
  .dialog::backdrop { background:rgba(10,31,42,.60); backdrop-filter:blur(3px); }
  .dialog-inner { padding:26px; }
  .dialog-symbol { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; margin-bottom:14px; background:#fff0ed; color:#af443e; font-size:22px; }
  .dialog h2 { font-size:20px; letter-spacing:-.02em; margin:0 0 8px; }
  .dialog p { color:var(--muted); line-height:1.75; font-size:14px; overflow-wrap:anywhere; }
  .dialog .target { background:#f1f5f6; padding:11px 13px; border-radius:9px; margin:15px 0; color:var(--ink); font-weight:600; }
  .dialog-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
  .dialog-actions button { border:1px solid var(--line); border-radius:9px; padding:10px 17px; cursor:pointer; background:#fff; color:var(--ink); font:inherit; font-size:13px; font-weight:700; }
  .dialog-actions .danger { color:#fff; background:#b23b40; border-color:#b23b40; }
  .dialog-actions .danger:hover { background:#922c32; }
  .dialog-actions button:disabled { opacity:.55; cursor:wait; }
  @media(prefers-reduced-motion:reduce) { * { transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<header>
  <a href="/">← 返回工作台</a>
  <span class="sep">/</span>
  <a href="/scan/{{.ID}}">扫描进度</a>
  <span class="sep">/</span>
  <span class="title">{{.Name}}</span>
</header>
<div class="main">
  <div class="document-heading"><div><h1>漏洞披露材料</h1><p>漏洞详情、复现条件与披露内容</p></div><a href="/scan/{{.ID}}" style="color:var(--accent);font-size:13px">返回扫描详情 →</a></div>
  <div class="content" id="content" data-render-state="loading">
    <span style="color:#888;font-size:0.9rem">正在加载披露材料…</span>
  </div>
<footer>911VulScan</footer>
</div>
<script src="/assets/marked-18.1.1.min.js"></script>
<script src="/assets/dompurify-3.4.17.min.js"></script>
<script nonce="{{.Nonce}}">
// Strict INERT allowlist for markdown rendered from an untrusted scanned repo.
// The disclosure markdown embeds attacker-controlled source in a code fence the
// repo can break out of; DOMPurify's DEFAULT config still permits style/form/
// input/img/svg, which allow beacon requests, CSS defacement, and same-origin
// phishing forms even though scripts are stripped. Restrict to inert formatting.
const MD_SANITIZE = {
  ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','blockquote',
    'ul','ol','li','pre','code','em','strong','del','a','span','div',
    'table','thead','tbody','tr','th','td','sup','sub','kbd'],
  ALLOWED_ATTR: ['href','title','class','align','colspan','rowspan'],
  FORBID_TAGS: ['style','form','input','button','textarea','select','option',
    'img','picture','source','svg','math','iframe','object','embed','link','base','meta','script'],
  FORBID_ATTR: ['style','src','srcset','action','formaction','background','poster','loading'],
  ALLOW_DATA_ATTR: false
};
const markdown = {{.MarkdownJSON}};
try {
  document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(markdown), MD_SANITIZE);
  document.getElementById('content').dataset.renderState = 'ready';
} catch (_) {
  document.getElementById('content').textContent = '内容加载失败，请刷新页面重试。';
  document.getElementById('content').dataset.renderState = 'error';
}
</script>
</body>
</html>
